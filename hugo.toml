baseURL = 'https://example.org/'
languageCode = 'en-us'
title = 'This title will be overridden'

[taxonomies]
    category = 'categories'

[params]

    [params.author]
        name        = "William Hicks"
        email       = "TBD Author Email"
        description = "TBD Author Desc"

    [params.galleriesdeluxe]
        # One of dartsass or libsass.
        # UPDATE: As of galleriesdeluxe v0.6.0, the following line is obsolete. See
        # https://github.com/bep/galleriesdeluxe/tree/main?tab=readme-ov-file#sass-was-replaced-with-css-in-v060
        # sass_transpiler = "dartsass"
        [params.galleriesdeluxe.cssvars]
        #   At least one key-value pair must remain 
        #   uncommented (see my note in Obsidian)
            foo_bar = "abc123"

    [params.gallerydeluxe]
        shuffle     = false
        reverse     = true
        # default is false:
        enable_exif = true
        # my addition:
        enable_captions = true

    [params.divemenu]
        xray = "depends"

        # Should the dive-menu.html template display the headings within each
        # page, when generating a Table Of Contents? This is like X-raying a
        # page to reveal its internal structure as part of the ToC. The
        # recognized values are (1) "always" and (2) "depends". Any other
        # value is equivalent to "never".
        #
        # "depends": X-ray a page only if that page's frontmatter has the
        # opaqueToDiveMenu param, *and* its value is false. So, the page won't
        # be X-rayed if opaqueToDiveMenu is absent or is set to true.

[markup]

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 5
    ordered = true

  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.typographer]
        disable = true

    [markup.goldmark.renderer]
        unsafe = true

# -----------------------------------------------------------

# "If you alter a default media type, you must also explicitly redefine all
#  output formats that utilize that media type."
#
# Source: https://gohugo.io/configuration/media-types/#modify-a-media-type
#
# I'm adding 'gmi' to the list of suffixes, so I'll also redefine the
# "text/markdown" output format:

[mediaTypes]
  [mediaTypes.'text/markdown']
    suffixes = ['gmi', 'md', 'mdown', 'markdown']

[outputFormats]
  [outputFormats.markdown]
    mediaType = 'text/markdown'

# -----------------------------------------------------------

[module]
    [[module.mounts]]
        source = "assets"
        target = "assets"
    [[module.mounts]]
        source = "content"
        target = "content"
    [[module.imports]]
        path = "github.com/bep/galleriesdeluxe"

