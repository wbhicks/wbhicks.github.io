baseURL = 'https://example.org/'
languageCode = 'en-us'
title = 'This title will be overridden'

[taxonomies]
    category = 'categories'

[params]

    [params.author]
        name        = "William Hicks"
        email       = "TBD Author Email"
        description = "TBD Author Desc"

    [params.galleriesdeluxe]
        # One of dartsass or libsass.
        sass_transpiler = "dartsass"
        [params.galleriesdeluxe.sassvars]
        #   At least one key-value pair must remain 
        #   uncommented (see my note in Obsidian)
            foo_bar = "abc123"

    [params.gallerydeluxe]
        shuffle     = false
        reverse     = true
        # default is false:
        enable_exif = true
        # my addition:
        enable_captions = true

    [params.divemenu]
        xray = "depends"
        # "depends" means use the opaqueToDiveMenu param in each page's frontmatter. Don't xray if param's absent.

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.typographer]
        disable = true

    [markup.goldmark.renderer]
        unsafe = true

[module]
    [[module.mounts]]
        source = "assets"
        target = "assets"
    [[module.mounts]]
        source = "content"
        target = "content"
    [[module.imports]]
        path = "github.com/bep/galleriesdeluxe"

