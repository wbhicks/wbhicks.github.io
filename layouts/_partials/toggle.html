.js-toggle-overall {
    display: table;
    margin: 0 auto;
    padding-bottom: 1em;
}

.js-toggle-font {
    touch-action: pan-x;
    display: inline-block;
    position: relative;
    cursor: pointer;
    background-color: transparent;
    border: 0;
    padding: 0;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    -webkit-tap-highlight-color: transparent;
    vertical-align: middle;
  }

.js-toggle-brightness {
    touch-action: pan-x;
    display: inline-block;
    position: relative;
    cursor: pointer;
    background-color: transparent;
    border: 0;
    padding: 0;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    -webkit-tap-highlight-color: transparent;
    vertical-align: middle;
  }
  
  .js-toggle-screenreader-only {
    border: 0;
    clip: rect(0 0 0 0);
    height: 1px;
    margin: -1px;
    overflow: hidden;
    padding: 0;
    position: absolute;
    width: 1px;
  }
  
  .js-toggle-track {
    width: 50px;
    height: 24px;
    padding: 0;
    border-radius: 30px;
    background-color: #333; //hsl(222, 14%, 7%);
    transition: all 0.2s ease;
  }
  
  .js-toggle-track-check {
    position: absolute;
    width: 17px;
    height: 17px;
    left: 5px;
    top: 0px;
    bottom: 0px;
    margin-top: auto;
    margin-bottom: auto;
    line-height: 0;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  
  .js-toggle-font--checked .js-toggle-track-check {
    opacity: 1;
    transition: opacity 0.25s ease;
  }
  
  .js-toggle-brightness--checked .js-toggle-track-check {
    opacity: 1;
    transition: opacity 0.25s ease;
  }
  
  .js-toggle-track-x {
    position: absolute;
    width: 17px;
    height: 17px;
    right: 5px;
    top: 0px;
    bottom: 0px;
    margin-top: auto;
    margin-bottom: auto;
    line-height: 0;
    opacity: 1;
    transition: opacity 0.25s ease;
  }
  
  .js-toggle-font--checked .js-toggle-track-x {
    opacity: 0;
  }
  
  .js-toggle-brightness--checked .js-toggle-track-x {
    opacity: 0;
  }
  
  .js-toggle-thumb {
    position: absolute;
    top: 1px;
    left: 1px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background-color: #aaa; //#fafafa;
    box-sizing: border-box;
    transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1) 0ms;
    transform: translateX(0);
  }
  
  .js-toggle-font--checked .js-toggle-thumb {
    transform: translateX(26px);
    border-color: #19ab27;
  }

  .js-toggle-brightness--checked .js-toggle-thumb {
    transform: translateX(26px);
    border-color: #19ab27;
  }

<script>
var body = document.body;
var switcher = document.getElementsByClassName('js-toggle-brightness')[0];
// Click on dark mode icon. Add dark mode classes and wrappers. Store user preference through sessions
switcher.addEventListener("click", function() {
  this.classList.toggle('js-toggle-brightness--checked');
  this.classList.add('js-toggle-brightness--focus');
  //If dark mode is selected
  if (this.classList.contains('js-toggle-brightness--checked')) {
    body.classList.remove('dev-mode');
    body.classList.add('qa-mode');
    // Save user preference in storage
    // localStorage.setItem('liteMode', 'false');
    localStorage.setItem('darkMode', 'true');
  } else {
    body.classList.remove('qa-mode');
    body.classList.add('dev-mode');
    setTimeout(function() {
      localStorage.removeItem('darkMode');
    }, 100);
  }
})
// Check Storage. Keep user preference on page reload
if (localStorage.getItem('darkMode')) {
  // body.classList.add('qa-mode');
  switcher.classList.add('js-toggle-brightness--checked');
  body.classList.remove('dev-mode');
  body.classList.add('qa-mode');
}
</script>
